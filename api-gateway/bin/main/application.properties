# Server Configuration
server.port=8086

# Spring Application Configuration
spring.application.name=api-gateway

# Spring Cloud Gateway Routes Configuration
spring.cloud.gateway.routes[0].id=user-service
spring.cloud.gateway.routes[0].uri=http://localhost:8081
spring.cloud.gateway.routes[0].predicates[0]=Path=/users/**

spring.cloud.gateway.routes[1].id=product-service
spring.cloud.gateway.routes[1].uri=http://localhost:8082
spring.cloud.gateway.routes[1].predicates[0]=Path=/products/**

spring.cloud.gateway.routes[2].id=order-service
spring.cloud.gateway.routes[2].uri=http://localhost:8083
spring.cloud.gateway.routes[2].predicates[0]=Path=/orders/**

spring.cloud.gateway.routes[3].id=inventory-service
spring.cloud.gateway.routes[3].uri=http://localhost:8084
spring.cloud.gateway.routes[3].predicates[0]=Path=/inventory/**

# API Docs routes — rewrite /api-docs/{service} → /v3/api-docs on each service
spring.cloud.gateway.routes[4].id=user-service-docs
spring.cloud.gateway.routes[4].uri=http://localhost:8081
spring.cloud.gateway.routes[4].predicates[0]=Path=/api-docs/user-service
spring.cloud.gateway.routes[4].filters[0]=RewritePath=/api-docs/user-service, /v3/api-docs

spring.cloud.gateway.routes[5].id=product-service-docs
spring.cloud.gateway.routes[5].uri=http://localhost:8082
spring.cloud.gateway.routes[5].predicates[0]=Path=/api-docs/product-service
spring.cloud.gateway.routes[5].filters[0]=RewritePath=/api-docs/product-service, /v3/api-docs

spring.cloud.gateway.routes[6].id=order-service-docs
spring.cloud.gateway.routes[6].uri=http://localhost:8083
spring.cloud.gateway.routes[6].predicates[0]=Path=/api-docs/order-service
spring.cloud.gateway.routes[6].filters[0]=RewritePath=/api-docs/order-service, /v3/api-docs

spring.cloud.gateway.routes[7].id=inventory-service-docs
spring.cloud.gateway.routes[7].uri=http://localhost:8084
spring.cloud.gateway.routes[7].predicates[0]=Path=/api-docs/inventory-service
spring.cloud.gateway.routes[7].filters[0]=RewritePath=/api-docs/inventory-service, /v3/api-docs

# SpringDoc OpenAPI Configuration
springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operations-sorter=method
springdoc.swagger-ui.tags-sorter=alpha
springdoc.swagger-ui.doc-expansion=none
springdoc.swagger-ui.disable-swagger-default-url=true
springdoc.swagger-ui.display-request-duration=true
springdoc.swagger-ui.default-models-expand-depth=1

# SpringDoc Service URLs for Aggregation
springdoc.swagger-ui.urls[0].name=User Service
springdoc.swagger-ui.urls[0].url=/api-docs/user-service

springdoc.swagger-ui.urls[1].name=Product Service
springdoc.swagger-ui.urls[1].url=/api-docs/product-service

springdoc.swagger-ui.urls[2].name=Order Service
springdoc.swagger-ui.urls[2].url=/api-docs/order-service

springdoc.swagger-ui.urls[3].name=Inventory Service
springdoc.swagger-ui.urls[3].url=/api-docs/inventory-service
